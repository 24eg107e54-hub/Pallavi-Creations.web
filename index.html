<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pallavi Creations - Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="top-bar"></div>

    <h1>Pallavi Creations</h1>
    <p class="subtitle">SAREES &amp; WEAVES</p>
    <p class="form-title">Create Your Account</p>

    <form id="registerForm" class="form-section">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address" placeholder="Enter your address">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required>

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>

      <button type="submit" class="submit-btn">Register</button>

      <p class="switch-text">Already have an account? <a href="#">Login</a></p>
    </form>
  </div>

</body>
</html>
