<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pallavi Creations - Login</title>
<link rel="stylesheet" href="auth-style.css">
</head>
<body>

<div class="box">
  <h1>Pallavi Creations</h1>
  <p class="sub">Sarees &amp; Weaves</p>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="switchTab('login')">Login</button>
    <button id="signupTab" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <!-- Login Form -->
  <form id="loginForm" class="active">
    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" placeholder="Enter your password" required>

    <button type="submit" class="submit">Login</button>
  </form>

  <!-- Sign Up Form -->
  <form id="signupForm">
    <label>Full Name</label>
    <input type="text" placeholder="Enter your name" required>

    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" placeholder="Create a password" required>

    <button type="submit" class="submit">Sign Up</button>
  </form>

  <p class="switch" id="switchText">
    Don't have an account? <a href="#" onclick="switchTab('signup')">Sign Up</a>
  </p>
</div>

<script>
  function switchTab(type) {
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const switchText = document.getElementById('switchText');

    if (type === 'login') {
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      switchText.innerHTML = 'Don\'t have an account? <a href="#" onclick="switchTab(\'signup\')">Sign Up</a>';
    } else {
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      switchText.innerHTML = 'Already have an account? <a href="#" onclick="switchTab(\'login\')">Login</a>';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Login form submitted!');
  });

  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Sign up form submitted!');
  });
</script>

</body>
</html>
